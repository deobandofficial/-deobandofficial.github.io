<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>Band Room</title>
<style>
:root{color-scheme:dark;--bg:#121212;--card:#1E1E1E;--line:#2E2E2E;--ink:#F1F1F1;--mute:#A0A0A0;--acc:#E63946;--acc-h:#C71F2D;--hd:Impact,Haettenschweiler,'Arial Narrow Bold',sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{margin:0;min-height:100%;background:radial-gradient(900px 420px at 50% -140px,rgba(230,57,70,.28),transparent 70%) no-repeat,#121212}
body{margin:0;background:none;color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;min-height:100vh}
#app{max-width:680px;margin:0 auto;padding:20px 16px 70px}
h1{display:flex;align-items:center;font:400 36px/1 var(--hd);text-transform:uppercase;letter-spacing:.05em;margin:0;text-shadow:0 0 28px rgba(230,57,70,.5)}
h2{font:400 21px/1.1 var(--hd);text-transform:uppercase;letter-spacing:.09em;margin:30px 0 12px}
h2::before{content:'';display:inline-block;width:6px;height:18px;background:var(--acc);border-radius:2px;margin-right:10px;vertical-align:-2px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.logo{height:52px;width:auto;max-width:100px;object-fit:contain;border-radius:12px;border:1px solid var(--line)}
.logo.big{height:96px;max-width:170px;display:block;margin:8px 0 12px;background:var(--bg);padding:4px}
.tag2{color:var(--mute);font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.sub{color:var(--mute);font-size:14px;margin:10px 0 16px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:8px;overflow-x:auto;padding:10px 0;margin:6px 0 0;background:rgba(18,18,18,.92);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
nav button{flex:none;background:var(--card);border:1px solid var(--line);border-radius:99px;font:700 12px inherit;font-family:inherit;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);padding:9px 15px;cursor:pointer}
nav button.on{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 4px 16px rgba(230,57,70,.35)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 12px;transition:border-color .15s}
.card:hover{border-color:#444}
.ev{display:flex;gap:14px;align-items:flex-start;border-left:3px solid var(--acc)}
.chip{flex:none;width:58px;text-align:center;background:var(--acc);color:#fff;border-radius:10px;padding:7px 0 6px;font:700 11px/1.1 inherit;font-family:inherit;letter-spacing:.1em;text-transform:uppercase;box-shadow:0 4px 14px rgba(230,57,70,.3)}
.chip b{display:block;font:400 29px/1.05 var(--hd);letter-spacing:0}
.past{opacity:.5}.past .chip{background:#3a3a3a;box-shadow:none}.past.ev{border-left-color:#3a3a3a}
.body{min-width:0;flex:1}
.lbl{font:700 11px/1 inherit;font-family:inherit;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.note{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:14px;padding:14px 16px;margin:16px 0 4px;white-space:pre-wrap}
.note::before{content:'Pinned';display:block;font:700 11px/1 inherit;font-family:inherit;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin-bottom:8px}
.when{font-weight:700;font-size:17px}.mute{color:var(--mute);font-size:14px}
.tag{font:700 10px/1 inherit;font-family:inherit;letter-spacing:.12em;background:var(--acc);color:#fff;border-radius:99px;padding:3px 8px;margin-left:8px;vertical-align:middle}
button.b{font:700 14px inherit;font-family:inherit;letter-spacing:.08em;text-transform:uppercase;background:var(--acc);color:#fff;border:0;border-radius:10px;padding:13px 20px;cursor:pointer;box-shadow:0 4px 18px rgba(230,57,70,.3)}
button.b:hover,button.b:active{background:var(--acc-h)}
button.b.alt{background:none;color:var(--ink);border:1px solid var(--line);box-shadow:none}
button.b.alt:hover{border-color:var(--acc);background:none}
button.lnk{background:none;border:0;color:var(--acc);font:700 12px inherit;font-family:inherit;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;padding:6px 0;margin-right:16px}
button.lnk:hover{color:#ff6b77}
input,textarea{width:100%;font:16px inherit;font-family:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px;margin:4px 0 14px}
input[type=file]{border:0;padding:4px 0;background:none}
textarea{min-height:130px}
input:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(230,57,70,.28)}
label{font:700 11px/1 inherit;font-family:inherit;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);display:block}
.row{display:flex;gap:12px}.row>div{flex:1;min-width:0}
ol.set{counter-reset:n;list-style:none;margin:12px 0 0;padding:0}
ol.set li{counter-increment:n;display:flex;align-items:baseline;gap:14px;padding:11px 0;border-bottom:1px dashed var(--line);font-size:19px;font-weight:600}
ol.set li:last-child{border:0}
ol.set li::before{content:counter(n,decimal-leading-zero);font:400 23px/1 var(--hd);color:var(--acc);min-width:34px}
.err{color:#ff6b77;font-weight:600;margin:2px 0 14px}
.ok{font-weight:600;margin:2px 0 14px;padding:10px 12px;border:1px solid var(--acc);border-radius:10px;background:rgba(230,57,70,.1)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-right:8px;animation:pl 1.8s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(230,57,70,.7)}100%{box-shadow:0 0 0 10px rgba(230,57,70,0)}}
.eq{display:inline-flex;gap:3px;align-items:flex-end;height:26px;margin-left:14px}
.eq i{width:5px;background:var(--acc);border-radius:2px;height:8px;animation:eq 1.1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.25s}.eq i:nth-child(3){animation-delay:.5s}.eq i:nth-child(4){animation-delay:.15s}
@keyframes eq{0%,100%{height:6px}50%{height:26px}}
@media (prefers-reduced-motion:reduce){.pulse,.eq i{animation:none}.eq i{height:16px}}
</style></head>
<body><div id="app"><h1>Loading…</h1></div>
<script>window.addEventListener('error',function(e){var d=document.getElementById('app');d.innerHTML='<h1>Something broke</h1><p>'+String(e.message).replace(/</g,'&lt;')+'</p><p>Your browser may be too old. Send this message to the admin.</p>'});</script>
<script>
const SUPABASE_URL = 'https://amxvngubbsuizstdvfnz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_d2sxmU-ESRJS6iY6GwtDLA_g880Z_Py';

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id), v=id=>(($(id)||{}).value||'').trim(), raw=id=>($(id)||{}).value||'';
let S={m:[],r:[],e:[],s:[],pending:[],meta:{},brand:{},me:null,token:null,booted:false,setup:false,fatal:'',tab:'overview',mode:'login',edit:null,arm:null,reset:null,editM:null,draft:null,err:'',ok:'',fill:null};
try{S.token=localStorage.getItem('bandToken')}catch(e){}
const store=t=>{try{t?localStorage.setItem('bandToken',t):localStorage.removeItem('bandToken')}catch(e){}};
const adm=()=>!!(S.me&&S.me.is_admin);
const curBrand=()=>S.me?S.meta:(S.brand||{});

async function api(fn,args){
  const ac=new AbortController(),to=setTimeout(()=>ac.abort(),12000);let r;
  try{r=await fetch(SUPABASE_URL.replace(/\/$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',signal:ac.signal,headers:{'Content-Type':'application/json',apikey:SUPABASE_KEY},body:JSON.stringify(args||{})})}
  catch(e){throw new Error(e.name==='AbortError'?'Timed out reaching the database.':'Could not reach the database. Check your connection.')}
  finally{clearTimeout(to)}
  const j=await r.json().catch(()=>null);
  if(!r.ok)throw new Error((j&&j.message)||'Request failed');
  return j;
}
async function refresh(){
  const d=await api('get_all',{p_token:S.token});
  Object.assign(S,{me:d.me,m:d.members,pending:d.pending||[],r:d.rehearsals,e:d.events,s:d.setlists,meta:d.meta||{}});
}
async function boot(){
  try{
    try{S.brand=await api('get_brand')||{}}catch(e){}
    S.setup=await api('needs_setup');
    if(!S.setup&&S.token){try{await refresh()}catch(e){S.token=null;store(null)}}
  }catch(e){S.fatal=e.message}
  S.booted=true;render();
}
setInterval(async()=>{if(S.token&&S.me&&!document.hidden){try{await refresh();render(true)}catch(e){}}},20000);
render();boot();

function theme(){
  const b=curBrand();document.title=b.band_name||'Band Room';
  if(b.logo&&/^data:image\//.test(b.logo))['icon','apple-touch-icon'].forEach(r=>{let l=document.querySelector('link[rel="'+r+'"]');if(!l){l=document.createElement('link');l.rel=r;document.head.appendChild(l)}l.href=b.logo});
}
const EQ='<span class="eq"><i></i><i></i><i></i><i></i></span>';
const brandHead=hero=>{const b=curBrand();return`<div class="brand">${b.logo&&/^data:image\//.test(b.logo)?`<img class="logo" src="${b.logo}" alt="">`:''}<div><h1>${esc(b.band_name||'Band Room')}${hero?EQ:''}</h1>${b.tagline?`<div class="tag2">${esc(b.tagline)}</div>`:''}</div></div>`};

const today=()=>new Date().toLocaleDateString('en-CA');
const byDate=(a,b)=>((a.day||'')+(a.at||'')).localeCompare((b.day||'')+(b.at||''));
const chip=d=>{const x=new Date(d+'T00:00');if(isNaN(x))return'';return`<div class="chip">${x.toLocaleDateString(undefined,{weekday:'short'})}<b>${x.getDate()}</b>${x.toLocaleDateString(undefined,{month:'short'})}</div>`};
const field=(id,l,t,ac)=>`<label for="${id}">${l}</label><input id="${id}" type="${t||'text'}" autocomplete="${ac||'off'}" ${ac==='username'?'autocapitalize="none" autocorrect="off" spellcheck="false"':''}>`;
const msgs=()=>(S.ok?`<div class="ok">${esc(S.ok)}</div>`:'')+(S.err?`<div class="err">${esc(S.err)}</div>`:'');

function render(keep){
  const a=document.activeElement,app=$('app');
  if(keep&&a&&/INPUT|TEXTAREA/.test(a.tagName)&&app.contains(a))return;
  const ins=()=>[...app.querySelectorAll('input,textarea')].filter(i=>i.id&&i.type!=='file');
  const vals={};ins().forEach(i=>{vals[i.id]=i.value});
  theme();draw(app);
  ins().forEach(i=>{if(keep&&vals[i.id]!=null)i.value=vals[i.id]});
  if(!keep){const d=S.draft||{};const f=Object.assign({o_note:S.meta.notice||'',t_band:d.band,t_tag:d.tagline},S.fill||{});S.fill=null;for(const k in f)if($(k)&&f[k]!=null)$(k).value=f[k]}
}
function draw(app){
  if(!S.booted)return app.innerHTML='<h1>Loading…</h1>';
  if(S.fatal)return app.innerHTML=`${brandHead(true)}<div class="card" style="margin-top:16px"><div class="when">Couldn't connect</div><p>${esc(S.fatal)}</p></div>`;
  if(S.setup)return app.innerHTML=`${brandHead(true)}<p class="sub">First time here. Make the first admin account (that's you).</p>
  <div class="card">${field('s_name','Your name')}${field('s_role','Instrument / role')}${field('s_user','Choose a username','text','username')}${field('s_pw','Choose a password (8+ characters)','password','new-password')}${msgs()}<button class="b" data-a="setup">Create & enter</button></div>`;
  if(!S.me)return app.innerHTML=authView();
  app.innerHTML=shell(({overview,rehearsals,events,setlists,members,settings})[S.tab]());
}
function authView(){
  if(S.mode==='signup')return`${brandHead(true)}<p class="sub">Request an account. An admin has to approve you before you can log in.</p>
  <div class="card">${field('g_name','Your name')}${field('g_role','Instrument / role')}${field('g_user','Choose a username','text','username')}${field('g_pw','Choose a password (8+ characters)','password','new-password')}${field('g_pw2','Type the password again','password','new-password')}${msgs()}
  <button class="b" data-a="signup">Send request</button> <button class="b alt" data-a="mode" data-id="login">Back</button></div>`;
  return`${brandHead(true)}<p class="sub">Log in</p><div class="card">${field('u_user','Username','text','username')}${field('u_pw','Password','password','current-password')}${msgs()}
  <button class="b" data-a="login">Log in</button></div><p class="mute">New here? <button class="lnk" data-a="mode" data-id="signup">Request an account</button></p>`;
}
function shell(body){
  const t=[['overview','Overview'],['rehearsals','Rehearsals'],['events','Events'],['setlists','Setlists'],['members','Band']];
  if(adm())t.push(['settings','Settings']);
  const n=adm()&&S.pending.length?` (${S.pending.length})`:'';
  return`<div class="top">${brandHead()}<button class="lnk" data-a="logout">Log out</button></div>
  <div class="sub">${esc(S.me.name)} · ${esc(S.me.role)}${adm()?'<span class="tag">ADMIN</span>':''}</div>
  <nav>${t.map(([k,l])=>`<button data-a="tab" data-id="${k}" class="${S.tab===k?'on':''}">${l}${k==='members'?n:''}</button>`).join('')}</nav>${body}`}

function overview(){
  const t=today(),nr=[...S.r].filter(x=>x.day>=t).sort(byDate)[0],ne=[...S.e].filter(x=>x.day>=t).sort(byDate)[0],ls=S.s[S.s.length-1];
  const item=(h,x,line)=>`<div class="card ev">${x?chip(x.day):''}<div class="body"><div class="lbl">${h}</div>${x?`<div class="when">${x.at?esc(x.at):'Time TBC'}</div><div>${esc(line(x))}</div>`:'<div class="mute">Nothing booked.</div>'}</div></div>`;
  return`${S.meta.notice?`<div class="note">${esc(S.meta.notice)}</div>`:''}
  <h2>Coming up</h2>${item('<span class="pulse"></span>Next rehearsal',nr,x=>x.place||'')}${item('<span class="pulse"></span>Next event',ne,x=>x.title+(x.place?' @ '+x.place:''))}
  <div class="card"><div class="lbl">Setlists</div><div>${S.s.length?S.s.length+' saved'+(ls?` · latest: ${esc(ls.name)}`:''):'None yet.'}</div></div>
  ${adm()?`<h2>Pinned note</h2><div class="card"><label for="o_note">Shown at the top of the overview for everyone</label><textarea id="o_note"></textarea>${msgs()}<button class="b" data-a="notice">Save note</button></div>`:''}`}

function listView(kind){
  const R=kind==='r',arr=[...(R?S.r:S.e)].sort(byDate),t=today();
  return`<h2>${R?'Rehearsals':'Events'}</h2>`+(arr.length?arr.map(x=>`<div class="card ev ${x.day<t?'past':''}">${chip(x.day)}<div class="body">
  ${x.title?`<div class="when">${esc(x.title)}</div>`:''}<div class="${x.title?'':'when'}">${x.at?esc(x.at):'Time TBC'}${x.place?' · '+esc(x.place):''}</div>${x.notes?`<div class="mute">${esc(x.notes)}</div>`:''}
  ${adm()?`<button class="lnk" data-a="del" data-k="${kind}" data-id="${x.id}">${S.arm===x.id?'Sure?':'Delete'}</button>`:''}</div></div>`).join(''):'<p class="mute">Nothing here yet.</p>')+
  (adm()?`<h2>Add ${R?'rehearsal':'event'}</h2><div class="card">${R?'':field('f_title','Event name')}<div class="row"><div>${field('f_date','Date','date')}</div><div>${field('f_time','Time')}</div></div>${field('f_place','Where')}${field('f_notes','Notes')}${msgs()}<button class="b" data-a="add" data-k="${kind}">Add</button></div>`:'')}
const rehearsals=()=>listView('r'), events=()=>listView('e');

function setlists(){
  const ed=S.s.find(x=>x.id===S.edit);
  return`<h2>Setlists</h2>`+(S.s.length?S.s.map(x=>`<div class="card"><div class="when">${esc(x.name)}</div><ol class="set">${(x.songs||[]).map(s=>`<li>${esc(s)}</li>`).join('')}</ol>
  ${adm()?`<div style="margin-top:10px"><button class="lnk" data-a="editS" data-id="${x.id}">Edit</button><button class="lnk" data-a="del" data-k="s" data-id="${x.id}">${S.arm===x.id?'Sure?':'Delete'}</button></div>`:''}</div>`).join(''):'<p class="mute">None yet.</p>')+
  (adm()?`<h2>${ed?'Edit':'New'} setlist</h2><div class="card">${field('l_name','Name (e.g. Friday gig)')}<label for="l_songs">Songs, one per line, in order</label><textarea id="l_songs"></textarea>${msgs()}<button class="b" data-a="saveS">Save</button>${ed?' <button class="b alt" data-a="cancelS">Cancel</button>':''}</div>`:'')}

function members(){
  let h='';
  if(adm()&&S.pending.length)h+=`<h2>Waiting for approval</h2>`+S.pending.map(p=>`<div class="card"><b>${esc(p.name)}</b> <span class="mute">@${esc(p.username)}</span><div class="mute">${esc(p.role)}</div>
  <div style="margin-top:8px"><button class="lnk" data-a="approve" data-id="${p.id}">Approve</button><button class="lnk" data-a="del" data-k="p" data-id="${p.id}">${S.arm===p.id?'Sure?':'Reject'}</button></div></div>`).join('');
  h+=`<h2>Band</h2>`+S.m.map(m=>{
    const me=m.id===S.me.id;
    if(adm()&&S.editM===m.id)return`<div class="card">${field('e_name','Name')}${field('e_role','Instrument / role')}<button class="b" data-a="editSave" data-id="${m.id}">Save</button> <button class="b alt" data-a="editOpen" data-id="${m.id}">Cancel</button></div>`;
    return`<div class="card"><b>${esc(m.name)}</b>${m.is_admin?'<span class="tag">ADMIN</span>':''}${adm()&&m.username?` <span class="mute">@${esc(m.username)}</span>`:''}<div class="mute">${esc(m.role)}</div>
  ${adm()?`<div style="margin-top:8px"><button class="lnk" data-a="editOpen" data-id="${m.id}">Edit</button>${me?'':`<button class="lnk" data-a="admin" data-id="${m.id}">${m.is_admin?'Remove admin':'Make admin'}</button>`}<button class="lnk" data-a="resetOpen" data-id="${m.id}">New password</button>${me?'':`<button class="lnk" data-a="del" data-k="m" data-id="${m.id}">${S.arm===m.id?'Sure?':'Remove'}</button>`}</div>
  ${S.reset===m.id?`<div style="margin-top:8px">${field('n_pw','New password for '+esc(m.name)+' (8+ characters)','password','new-password')}<button class="b" data-a="resetDo" data-id="${m.id}">Save password</button></div>`:''}`:''}</div>`}).join('');
  h+=`<h2>Your account</h2><div class="card"><div class="mute">Change your password</div>${field('c_old','Current password','password','current-password')}${field('c_new','New password (8+ characters)','password','new-password')}${msgs()}<button class="b" data-a="chgpw">Change password</button></div>`;
  return h}

function settings(){
  const d=S.draft||(S.draft={band:S.meta.band_name||'',tagline:S.meta.tagline||'',accent:S.meta.accent||'blue',logo:S.meta.logo||''});
  const ok=d.logo&&/^data:image\//.test(d.logo);
  return`<h2>Settings</h2><div class="card">${field('t_band','Band name')}${field('t_tag','Tagline (optional, shows under the name)')}
  <label>Logo</label>${ok?`<img class="logo big" src="${d.logo}" alt="">`:'<div class="mute" style="margin:6px 0 8px">No logo yet.</div>'}
  <input id="t_logo" type="file" accept="image/*">${ok?'<button class="lnk" data-a="rmlogo">Remove logo</button>':''}
  ${msgs()}<button class="b" data-a="saveSet">Save settings</button></div>`}

const keepDraft=()=>{if(S.draft&&$('t_band')){S.draft.band=v('t_band');S.draft.tagline=v('t_tag');S.fill={t_band:S.draft.band,t_tag:S.draft.tagline}}};
const pwBad=p=>p.length<8;
const run=async f=>{try{S.err='';S.ok='';await f()}catch(e){S.err=e.message||'Could not save.'}render(!!S.err)};
const write=async(fn,args)=>{await api(fn,Object.assign({p_token:S.token},args));await refresh()};
const start=t=>{S.token=t;store(t);S.mode='login'};

document.addEventListener('change',e=>{
  if(e.target.id!=='t_logo'||!e.target.files[0])return;
  const rd=new FileReader();
  rd.onload=()=>{const im=new Image();
    im.onload=()=>{const sc=Math.min(1,256/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*sc));c.height=Math.max(1,Math.round(im.height*sc));
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);keepDraft();S.draft.logo=c.toDataURL('image/png');S.err='';render()};
    im.onerror=()=>{S.err='That image could not be read. Try a PNG or JPG.';render()};im.src=rd.result};
  rd.readAsDataURL(e.target.files[0]);
});

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id,k=b.dataset.k;
  run(async()=>{
    if(a==='tab'){S.tab=id;S.edit=S.reset=S.arm=S.editM=S.draft=null}
    else if(a==='mode'){S.mode=id}
    else if(a==='logout'){try{await api('logout',{p_token:S.token})}catch(x){}S.token=null;S.me=null;S.draft=null;store(null);S.mode='login';S.tab='overview'}
    else if(a==='setup'){const n=v('s_name'),r=v('s_role'),u=v('s_user').toLowerCase(),p=raw('s_pw');if(!n||!r){S.err='Needs a name and a role.';return}if(pwBad(p)){S.err='Password needs at least 8 characters.';return}
      start(await api('setup_admin',{p_username:u,p_name:n,p_role:r,p_password:p}));S.setup=false;await refresh()}
    else if(a==='signup'){const n=v('g_name'),r=v('g_role'),u=v('g_user').toLowerCase(),p=raw('g_pw');if(!n||!r){S.err='Needs a name and a role.';return}
      if(pwBad(p)){S.err='Password needs at least 8 characters.';return}if(p!==raw('g_pw2')){S.err="The two passwords don't match.";return}
      await api('signup',{p_username:u,p_name:n,p_role:r,p_password:p});S.mode='login';S.ok='Request sent. An admin has to approve you before you can log in.'}
    else if(a==='login'){const res=await api('login',{p_username:v('u_user').toLowerCase(),p_password:raw('u_pw')});
      if(res.token){start(res.token);await refresh()}else S.err=res.error==='locked'?'Too many tries. Wait 5 minutes.':res.error==='pending'?'Your account is waiting for approval.':'Wrong username or password.'}
    else if(a==='notice'){await write('save_notice',{p_notice:$('o_note').value.trim()});S.ok='Saved.'}
    else if(a==='rmlogo'){keepDraft();S.draft.logo=''}
    else if(a==='saveSet'){keepDraft();const d=S.draft;if(!d.band){S.err='Band name is required.';return}
      await write('save_settings',{p_band:d.band,p_tagline:d.tagline,p_accent:S.meta.accent||'blue',p_logo:d.logo});S.draft=null;S.ok='Settings saved.'}
    else if(a==='add'){const d={p_id:null,p_day:v('f_date'),p_at:v('f_time'),p_place:v('f_place'),p_notes:v('f_notes')};
      if(!d.p_day){S.err='Needs a date.';return}
      if(k==='e'){d.p_title=v('f_title');if(!d.p_title){S.err='Needs a name and a date.';return}}
      await write(k==='r'?'save_rehearsal':'save_event',d)}
    else if(a==='del'){if(S.arm!==id){S.arm=id;return}S.arm=null;
      if(k==='m')await write('remove_member',{p_id:id});else if(k==='p')await write('reject_member',{p_id:id});else await write('delete_item',{p_kind:{r:'rehearsal',e:'event',s:'setlist'}[k],p_id:id})}
    else if(a==='editS'){S.edit=id;const x=S.s.find(y=>y.id===id);S.fill={l_name:x.name,l_songs:(x.songs||[]).join('\n')}}
    else if(a==='cancelS'){S.edit=null}
    else if(a==='saveS'){const songs=$('l_songs').value.split('\n').map(x=>x.trim()).filter(Boolean),name=v('l_name');
      if(!name||!songs.length){S.err='Needs a name and at least one song.';return}
      await write('save_setlist',{p_id:S.edit||null,p_name:name,p_songs:songs});S.edit=null}
    else if(a==='approve'){await write('approve_member',{p_id:id})}
    else if(a==='editOpen'){S.editM=S.editM===id?null:id;const x=S.m.find(y=>y.id===id);S.fill={e_name:x.name,e_role:x.role}}
    else if(a==='editSave'){await write('edit_member',{p_id:id,p_name:v('e_name'),p_role:v('e_role')});S.editM=null}
    else if(a==='admin'){const m=S.m.find(x=>x.id===id);await write('set_admin',{p_id:id,p_admin:!m.is_admin})}
    else if(a==='resetOpen'){S.reset=S.reset===id?null:id}
    else if(a==='resetDo'){const p=raw('n_pw');if(pwBad(p)){S.err='Password needs at least 8 characters.';return}await write('reset_password',{p_id:id,p_password:p});S.reset=null;S.ok='Password changed. Tell them the new one yourself.'}
    else if(a==='chgpw'){const o=raw('c_old'),n=raw('c_new');if(pwBad(n)){S.err='New password needs at least 8 characters.';return}await write('change_password',{p_old:o,p_new:n});S.ok='Password changed.'}
  });
});
</script></body></html>
